# ─────────────────────────────────────────────────────────────────────────────
# Deploy — Centro de Ayuda FunnelizaLab
#
# Este workflow se dispara en cada push a la rama `main` y despliega el sitio
# en GitHub Pages usando la rama `gh-pages`.
#
# PRIMERA VEZ: Después del primer push, habilita GitHub Pages en:
#   Settings → Pages → Build and deployment
#   → Source: "Deploy from a branch"
#   → Branch: gh-pages / (root)
#   → Guardar
#
# URL pública resultante:
#   https://corporacionpingosaki-hub.github.io/ayuda-funnelizalab/
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Permite ejecutar manualmente desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Build & Deploy Docusaurus
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Node.js (versión LTS)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 3. Instalar dependencias
      - name: Install dependencies
        run: npm ci

      # 4. Construir el sitio estático
      - name: Build website
        run: npm run build

      # 5. Publicar en rama gh-pages
      # peaceiris/actions-gh-pages es el método más estable para Docusaurus en CI.
      # La rama gh-pages se creará automáticamente si no existe.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          # Mensaje de commit en la rama gh-pages
          commit_message: 'chore(deploy): ${{ github.event.head_commit.message }}'
          # Mantiene el historial limpio (solo el último commit)
          force_orphan: true
